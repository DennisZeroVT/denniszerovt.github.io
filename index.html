<style id="ff-and-square">
/* ================================================================
   FIREFOX OPTIMIZATIONS + SQUARE AESTHETIC
   ================================================================ */

/* ---------- SQUARE: Tailwind radius utilities ---------- */
.rounded-sm            { border-radius: 2px !important; }
.rounded, .rounded-md  { border-radius: 3px !important; }
.rounded-lg            { border-radius: 4px !important; }
.rounded-xl            { border-radius: 5px !important; }
.rounded-2xl           { border-radius: 6px !important; }
.rounded-3xl           { border-radius: 8px !important; }
.rounded-full          { border-radius: 4px !important; }
.rounded-\[2rem\]      { border-radius: 6px !important; }
.rounded-t-\[2rem\]    { border-radius: 6px 6px 0 0 !important; }
.rounded-t-\[1\.5rem\] { border-radius: 6px 6px 0 0 !important; }
.rounded-b-\[1\.5rem\] { border-radius: 0 0 6px 6px !important; }

/* ---------- SQUARE: custom components ---------- */
.nav-pill, #hq-toggle, .view-toggle, .view-toggle button,
.genre-pill-btn, .person-role-pill, .person-chip, .person-social-btn,
.social-btn, .badge-platform, .p-tag, .cat-list-btn,
.song-row, .song-row .song-row-thumb,
.blog-search input, .blog-select, #mobile-menu-btn,
.overlay-content, #songOverlayGlass, #albumOverlay .glass,
.statusbar, .home-stats, .home-stat {
  border-radius: 4px !important;
}
.home-stats { border-radius: 6px !important; }
.home-stat  { border-radius: 0 !important; }
.song-genre-chip, .song-year-badge,
.badge-platform, .p-tag, .person-chip,
.person-role-pill { border-radius: 2px !important; }
.view-toggle button { border-radius: 2px !important; }
.blog-search input, .blog-select, .cat-list-btn { border-radius: 3px !important; }

/* ---------- SQUARE: covers & art blocks ---------- */
#songs-grid .aspect-square,
#albums-grid .aspect-square,
#ovCoverImg, #ovCoverEmoji,
#bpCover, #bpEmoji,
#alCover, #albumOverlay .w-60.h-60,
#home-latest .w-20.h-20,
#songOverlayGlass .w-64.h-64,
#songOverlayGlass .w-64.h-64 > div {
  border-radius: 4px !important;
}

/* ---------- SQUARE: round buttons → squares ---------- */
.w-14.h-14.rounded-full, .w-12.h-12.rounded-full,
.w-10.h-10.rounded-full, .w-9.h-9.rounded-full,
.w-8.h-8.rounded-full {
  border-radius: 3px !important;
}

.w-2.h-2.rounded-full { border-radius: 9999px !important; }
/* Progress handle → square */
#ovHandle { border-radius: 2px !important; }

/* ---------- SQUARE: avatars become squircles ---------- */
.person-avatar-ring, .person-avatar-wrap {
  border-radius: 6px !important;
}
.person-avatar-ring img, .person-avatar-wrap img { border-radius: 4px !important; }

/* ---------- SQUARE: brand marks & misc ---------- */
nav .w-10.h-10,
#mobile-menu .w-10.h-10 { border-radius: 4px !important; }
#mobile-menu-btn .hb-line { border-radius: 0 !important; }
.logo { border-radius: 4px !important; }

/* ================================================================
   FIREFOX-SPECIFIC
   Firefox 103+ supports unprefixed backdrop-filter but renders it
   slower on fixed-position overlays than Chromium does. Also
   ignores ::-webkit-scrollbar, and handles fixed backgrounds badly.
   ================================================================ */
@-moz-document url-prefix() {

  /* Backdrop-blur — keep base, trim overlays */
  .glass, .people-grid .person-card {
    backdrop-filter: blur(18px) saturate(135%);
    -webkit-backdrop-filter: blur(18px) saturate(135%);
  }
  #songOverlay > .absolute.inset-0,
  #albumOverlay > .absolute.inset-0,
  #mobile-menu-overlay {
    backdrop-filter: blur(6px) !important;
    -webkit-backdrop-filter: blur(6px) !important;
  }
  #mobile-menu {
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
  }
  .overlay {
    backdrop-filter: blur(5px) !important;
    -webkit-backdrop-filter: blur(5px) !important;
  }

  /* Native Firefox scrollbars (::-webkit-scrollbar is ignored) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(165,150,218,0.45) transparent;
  }
  .modal-body, .lane-scroll, #songOverlayGlass,
  #blog-posts-container, #mobile-menu nav,
  .blog-sidebar {
    scrollbar-width: thin;
    scrollbar-color: rgba(165,150,218,0.6) rgba(0,0,0,0.25);
  }

  /* Fixed backgrounds are a performance drain in Firefox */
  body {
    background-attachment: scroll !important;
  }
  body.optimized {
    background-attachment: scroll !important;
  }

  /* Form controls */
  input[type="range"] { accent-color: #A596DA; }
  select, input, textarea { color-scheme: dark; }

  /* line-clamp normalised (FF supports -webkit- prefix as an alias) */
  .person-card-bio {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Text smoothing — FF renders heavier without this */
  body { -moz-osx-font-smoothing: grayscale; }

  /* Focus ring visibility */
  :focus-visible {
    outline: 2px solid #A596DA !important;
    outline-offset: 2px !important;
  }

  /* Firefox AA for gradient text (some FF versions clip badly) */
  .gradient-text {
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: transparent;
  }
}
</style>
