<style id="ff-and-square">
/* ================================================================
   FIREFOX + SQUARE AESTHETIC (CMS)
   ================================================================ */

/* ---------- SQUARE: flatten radii ---------- */
:root { --radius: 6px; }

.tab, .btn, .connect input, .item, .badge, .logo, .block,
.icon, .editor.is-open .ed-close, .alert, .audio, .file-btn,
.statusbar, .modal img, #modalImg,
input[type="text"], input[type="number"], input[type="date"],
input[type="password"], select, textarea {
  border-radius: 4px !important;
}
.thumb { border-radius: 3px !important; }
.badge, .chip { border-radius: 2px !important; }
.switch input { border-radius: 4px !important; }
.switch input::after { border-radius: 2px !important; }
.editor.is-open { border-radius: 8px !important; }
.editor.is-open .ed-close { border-radius: 4px !important; }
.workspace .sidebar,
.workspace .editor { border-radius: 6px !important; }

/* ================================================================
   FIREFOX
   ================================================================ */
@-moz-document url-prefix() {

  /* Unprefixed backdrop-filter — FF 103+ needs this to render the
     glass panel; without it the CMS sidebar is fully transparent. */
  .glass, .editor.is-open .ed-head {
    backdrop-filter: blur(14px) saturate(135%);
    -webkit-backdrop-filter: blur(14px) saturate(135%);
  }
  .modal {
    backdrop-filter: blur(6px) !important;
    -webkit-backdrop-filter: blur(6px) !important;
  }
  body.cms-modal-open::before {
    backdrop-filter: blur(4px) !important;
    -webkit-backdrop-filter: blur(4px) !important;
  }

  /* Native Firefox scrollbars */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(165,150,218,0.5) rgba(0,0,0,0.2);
  }
  .list, .ed-body, .modal {
    scrollbar-width: thin;
    scrollbar-color: rgba(165,150,218,0.55) rgba(0,0,0,0.25);
  }

  /* Form-control colors */
  input[type="color"] { color-scheme: dark; }
  input[type="range"] { accent-color: #A596DA; }
  textarea { resize: vertical; }

  /* Focus ring visibility */
  :focus-visible {
    outline: 2px solid var(--accent) !important;
    outline-offset: 2px !important;
  }

  /* Fixed radial-gradient pseudo-layer is fine, but the mask-composite
     on .gradient-border::before needs both keyword sets in FF */
  .gradient-border::before {
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }
}
</style>
